<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 848" width="1600" height="848" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="win"><rect width="1600" height="848" rx="18"/></clipPath>
    <clipPath id="preview"><rect x="24" y="72" width="1120" height="630" rx="10"/></clipPath>
    <clipPath id="cam"><rect x="839" y="519" width="280" height="158" rx="6"/></clipPath>
    <linearGradient id="camBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5160"/>
      <stop offset="1" stop-color="#2a2d35"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b08f"/>
      <stop offset="1" stop-color="#c98f6c"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity=".14"/>
    </filter>
  </defs>

  <g clip-path="url(#win)">
    <rect width="1600" height="848" fill="#f5f5f7"/>
    <!-- Title bar -->
    <rect width="1600" height="52" fill="#ececee"/>
    <rect y="51" width="1600" height="1" fill="#d6d6d9"/>
    <circle cx="28" cy="26" r="7" fill="#ff5f57"/>
    <circle cx="52" cy="26" r="7" fill="#febc2e"/>
    <circle cx="76" cy="26" r="7" fill="#28c840"/>
    <text x="800" y="31" text-anchor="middle" font-size="15" font-weight="600" fill="#3c3c43">OnAir</text>

    <!-- Preview: a slide with the camera in the corner -->
    <g clip-path="url(#preview)">
      <rect x="24" y="72" width="1120" height="630" fill="#ffffff"/>
      <rect x="24" y="72" width="1120" height="6" fill="#e5242b"/>
      <text x="96" y="186" font-size="46" font-weight="700" fill="#1c1c1e" letter-spacing="-1">How we cut our build time in half</text>
      <text x="96" y="232" font-size="22" fill="#6e6e73">Live demo · part 2 of 3</text>
      <g fill="#d1d1d6">
        <rect x="96" y="292" width="360" height="14" rx="7"/>
        <rect x="96" y="326" width="300" height="14" rx="7"/>
        <rect x="96" y="360" width="330" height="14" rx="7"/>
        <rect x="96" y="394" width="250" height="14" rx="7"/>
      </g>
      <g>
        <rect x="520" y="300" width="56" height="300" rx="6" fill="#d1d1d6"/>
        <rect x="596" y="360" width="56" height="240" rx="6" fill="#d1d1d6"/>
        <rect x="672" y="430" width="56" height="170" rx="6" fill="#d1d1d6"/>
        <rect x="748" y="470" width="56" height="130" rx="6" fill="#e5242b"/>
        <rect x="508" y="600" width="310" height="2" fill="#c7c7cc"/>
      </g>
      <!-- Camera -->
      <g clip-path="url(#cam)">
        <rect x="839" y="519" width="280" height="158" fill="url(#camBg)"/>
        <rect x="839" y="519" width="280" height="158" fill="#f5c08a" opacity=".06"/>
        <path d="M909 690 C 912 640, 944 622, 979 622 C 1014 622, 1046 640, 1049 690 Z" fill="#20232a"/>
        <rect x="967" y="604" width="24" height="24" rx="8" fill="#c98f6c"/>
        <ellipse cx="979" cy="584" rx="31" ry="36" fill="url(#skin)"/>
        <path d="M948 580 C 946 552, 962 542, 980 542 C 1000 542, 1013 552, 1011 578 C 1004 562, 990 558, 978 560 C 966 561, 955 566, 948 580 Z" fill="#3b2a22"/>
      </g>
      <rect x="839" y="519" width="280" height="158" rx="6" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="2"/>
    </g>
    <!-- Live badge -->
    <rect x="44" y="94" width="92" height="30" rx="6" fill="#e5242b"/>
    <text x="90" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff" letter-spacing=".5">● LIVE</text>

    <!-- Layout bar -->
    <rect x="24" y="722" width="840" height="44" rx="10" fill="#e3e3e6"/>
    <rect x="446" y="726" width="204" height="36" rx="8" fill="#ffffff" filter="url(#soft)"/>
    <g font-size="15" text-anchor="middle">
      <text x="129" y="749" fill="#3c3c43">Camera</text>
      <text x="339" y="749" fill="#3c3c43">Screen</text>
      <text x="548" y="749" fill="#1c1c1e" font-weight="600">Screen + camera</text>
      <text x="757" y="749" fill="#3c3c43">Side by side</text>
    </g>
    <text x="24" y="814" font-size="14" fill="#6e6e73">Streaming to YouTube · 1080p · 6 Mbps</text>

    <!-- Sidebar -->
    <rect x="1168" y="72" width="408" height="380" rx="12" fill="#ffffff" stroke="#e2e2e5"/>
    <text x="1192" y="108" font-size="13" font-weight="600" fill="#8e8e93" letter-spacing=".6">SOURCES</text>
    <g font-size="15">
      <text x="1192" y="152" fill="#3c3c43">Camera</text>
      <text x="1552" y="152" text-anchor="end" fill="#1c1c1e">FaceTime HD Camera</text>
      <rect x="1192" y="172" width="360" height="1" fill="#ececee"/>
      <text x="1192" y="208" fill="#3c3c43">Microphone</text>
      <text x="1552" y="208" text-anchor="end" fill="#1c1c1e">MacBook Pro Microphone</text>
      <rect x="1192" y="228" width="360" height="1" fill="#ececee"/>
      <text x="1192" y="264" fill="#3c3c43">Screen + system audio</text>
      <text x="1192" y="294" fill="#1c1c1e">Keynote — Build time.key</text>
      <rect x="1446" y="276" width="106" height="28" rx="7" fill="#f2f2f4" stroke="#d6d6d9"/>
      <text x="1499" y="295" text-anchor="middle" font-size="14" fill="#1c1c1e">Change…</text>
    </g>
    <!-- Mic level -->
    <g>
      <text x="1192" y="352" font-size="13" fill="#8e8e93">Mic level</text>
      <rect x="1192" y="364" width="360" height="8" rx="4" fill="#ececee"/>
      <rect x="1192" y="364" width="210" height="8" rx="4" fill="#34c759"/>
      <text x="1192" y="406" font-size="13" fill="#8e8e93">System audio</text>
      <rect x="1192" y="418" width="360" height="8" rx="4" fill="#ececee"/>
      <rect x="1192" y="418" width="120" height="8" rx="4" fill="#34c759"/>
    </g>

    <rect x="1168" y="472" width="408" height="294" rx="12" fill="#ffffff" stroke="#e2e2e5"/>
    <text x="1192" y="508" font-size="13" font-weight="600" fill="#8e8e93" letter-spacing=".6">BROADCAST</text>
    <g font-size="15">
      <text x="1192" y="550" fill="#3c3c43">YouTube stream key</text>
      <rect x="1192" y="564" width="360" height="36" rx="8" fill="#f2f2f4" stroke="#e2e2e5"/>
      <text x="1206" y="588" fill="#8e8e93" letter-spacing="2">••••-••••-••••-••••</text>
      <text x="1192" y="636" fill="#3c3c43">Quality</text>
      <text x="1552" y="636" text-anchor="end" fill="#1c1c1e">1080p · 6 Mbps ⌄</text>
    </g>
    <rect x="1192" y="672" width="360" height="56" rx="10" fill="#e5242b"/>
    <text x="1372" y="706" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">End stream</text>
  </g>
  <rect x=".5" y=".5" width="1599" height="847" rx="17.5" fill="none" stroke="#000" stroke-opacity=".12"/>
</svg>
